name: Update reviewed brand navigation expectation
on:
  push:
    branches: [feat/local-brand-integration]
    paths: ['.github/workflows/update-brand-navigation-test.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'cr8ph8/QiScreenwrite' && github.ref == 'refs/heads/feat/local-brand-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Update the exact expected tab list
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, subprocess
          p = pathlib.Path('src/local/components/WriterDesk.test.tsx')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '01756578682a162d8117a68c4ea517341954d3246808fae832a83111452b07f9'
          s = p.read_text()
          old = "'Reports', 'Scoring & profiles', 'History1'"
          new = "'Reports', 'Brands & financing', 'Scoring & profiles', 'History1'"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'beb6e34dbe016f3335ee35b6e3f975eceb9f676337c88622de59bff8fcd28e1a'
          subprocess.run(['git','add','--',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: include Brands and financing in writer navigation regression'
          git push origin HEAD:refs/heads/feat/local-brand-integration
